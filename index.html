<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>ButterReads Wrapped — elevated spike</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#05030a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  #scroller{height:400vh}
  #stage{position:fixed;inset:0;z-index:0}
  canvas{display:block}
  .ui{position:fixed;inset:0;z-index:2;pointer-events:none}
  .brand{position:fixed;top:max(22px,5vh);left:24px;z-index:3;display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.01em;opacity:.92;font-size:15px}
  .brand .dot{width:11px;height:11px;border-radius:3px;background:linear-gradient(135deg,#ffd479,#ff8bd0);box-shadow:0 0 16px #ff8bd0}
  .panel{position:fixed;left:0;right:0;padding:0 26px;text-align:center;will-change:opacity,transform}
  .p-mid{top:50%;transform:translateY(-50%)}
  .p-low{bottom:max(46px,9vh)}
  .kicker{font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:700;opacity:.75;margin-bottom:10px}
  .huge{font-size:clamp(74px,26vw,190px);font-weight:850;line-height:.84;letter-spacing:-.04em;background:linear-gradient(180deg,#fff,#ffd479 65%,#ff9d5c);-webkit-background-clip:text;background-clip:text;color:transparent}
  .head{font-size:clamp(28px,7.4vw,52px);font-weight:800;line-height:1.03;letter-spacing:-.02em}
  .head em{font-style:normal;background:linear-gradient(90deg,#ffd479,#ff8bd0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:15px;opacity:.72;margin-top:12px;max-width:520px;margin-left:auto;margin-right:auto}
  .statrow{display:flex;gap:30px;justify-content:center;margin-top:22px}
  .stat b{display:block;font-size:24px;font-weight:800}
  .stat span{font-size:11px;opacity:.6;letter-spacing:.08em;text-transform:uppercase}
  .legend{display:flex;flex-wrap:wrap;gap:9px 15px;justify-content:center;margin-top:16px}
  .legend div{display:flex;align-items:center;gap:7px;font-size:14px;opacity:.9}
  .legend i{width:11px;height:11px;border-radius:50%;box-shadow:0 0 10px currentColor}
  .hint{position:fixed;left:0;right:0;bottom:12px;text-align:center;font-size:11px;letter-spacing:.24em;text-transform:uppercase;opacity:.35;z-index:3;transition:opacity .4s}
  .tag{position:fixed;top:max(22px,5vh);right:20px;z-index:3;font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.35}
</style>
</head>
<body>
<div id="scroller"></div>
<div id="stage"></div>
<div class="brand"><span class="dot"></span>ButterReads Wrapped</div>
<div class="tag">three.js spike</div>

<div class="ui">
  <div class="panel p-mid" id="pA">
    <div class="kicker">2026 · A year in books</div>
    <div class="head">Let's rewind <em>your</em> year.</div>
    <div class="sub">Every book you finished, loved, and abandoned — reassembled.</div>
  </div>
  <div class="panel p-mid" id="pB" style="opacity:0">
    <div class="kicker">You read</div>
    <div class="huge">47</div>
    <div class="head"><em>books</em></div>
    <div class="statrow">
      <div class="stat"><b>14.2k</b><span>Pages</span></div>
      <div class="stat"><b>3.9</b><span>Books / mo</span></div>
      <div class="stat"><b>Top 6%</b><span>of readers</span></div>
    </div>
  </div>
  <div class="panel p-low" id="pC" style="opacity:0">
    <div class="kicker">Your genre DNA</div>
    <div class="head">Literary at heart, <em>sci-fi</em> curious.</div>
    <div class="legend" id="legend"></div>
  </div>
</div>
<div class="hint" id="hint">Scroll ↓</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const N = 60000;
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05030a, 0.028);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 13);

// ---- gradient backdrop ----
const bg = new THREE.Mesh(new THREE.SphereGeometry(90, 32, 32),
  new THREE.ShaderMaterial({ side:THREE.BackSide, depthWrite:false,
    vertexShader:`varying vec3 vp; void main(){ vp=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec3 vp; void main(){ float t=clamp((normalize(vp).y+1.0)*0.5,0.0,1.0);
      vec3 top=vec3(0.11,0.03,0.16), mid=vec3(0.05,0.02,0.09), bot=vec3(0.18,0.05,0.12);
      vec3 c=mix(bot,mid,smoothstep(0.0,0.5,t)); c=mix(c,top,smoothstep(0.5,1.0,t));
      gl_FragColor=vec4(c,1.0);} `}));
scene.add(bg);

// ---------- helpers to build target position sets ----------
const palette = [
  [1.00,0.83,0.47],[1.00,0.55,0.81],[0.54,0.48,1.00],
  [0.35,0.82,0.75],[1.00,0.62,0.36],[0.48,0.88,1.00]
];
function rand(a,b){ return a + Math.random()*(b-a); }

// A) books: stack of glowing slabs
function targetBooks(){
  const p = new Float32Array(N*3);
  const layers = 13;
  for(let i=0;i<N;i++){
    const l = Math.floor(Math.random()*layers);
    const w = 4.2 + (l%3)*0.4;
    p[i*3]   = rand(-w/2, w/2);
    p[i*3+1] = -3.2 + l*0.52 + rand(-0.12,0.12);
    p[i*3+2] = rand(-1.4, 1.4);
  }
  return p;
}
// B) the number "47" sampled from a canvas
function targetText(txt, spread){
  const c = document.createElement('canvas'); c.width=420; c.height=220;
  const g = c.getContext('2d');
  g.fillStyle='#fff'; g.font='900 200px -apple-system,Arial,sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText(txt, 210, 118);
  const d = g.getImageData(0,0,c.width,c.height).data;
  const pts=[];
  for(let y=0;y<c.height;y+=2){ for(let x=0;x<c.width;x+=2){
    if(d[(y*c.width+x)*4+3] > 128) pts.push([x,y]);
  }}
  const p = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const s = pts[(Math.random()*pts.length)|0];
    p[i*3]   = (s[0]-210)/26 + rand(-0.05,0.05);
    p[i*3+1] = -(s[1]-110)/26 + rand(-0.05,0.05);
    p[i*3+2] = rand(-spread, spread);
  }
  return p;
}
// C) double helix (genre DNA)
function targetHelix(){
  const p = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const t = (i/N);
    const a = t*Math.PI*2*4;
    const side = (i%2===0)?1:-1;
    const r = 2.3 + rand(-0.12,0.12);
    p[i*3]   = Math.cos(a)*r*side;
    p[i*3+1] = (t-0.5)*11.0 + rand(-0.05,0.05);
    p[i*3+2] = Math.sin(a)*r;
  }
  return p;
}

const tA = targetBooks();
const tB = targetText('47', 0.5);
const tC = targetHelix();

// per-particle color + seed
const colors = new Float32Array(N*3);
const seeds = new Float32Array(N);
for(let i=0;i<N;i++){
  const c = palette[(Math.random()*palette.length)|0];
  colors[i*3]=c[0]; colors[i*3+1]=c[1]; colors[i*3+2]=c[2];
  seeds[i]=Math.random();
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(tA.slice(),3));
geo.setAttribute('tA', new THREE.BufferAttribute(tA,3));
geo.setAttribute('tB', new THREE.BufferAttribute(tB,3));
geo.setAttribute('tC', new THREE.BufferAttribute(tC,3));
geo.setAttribute('pcolor', new THREE.BufferAttribute(colors,3));
geo.setAttribute('seed', new THREE.BufferAttribute(seeds,1));

const mat = new THREE.ShaderMaterial({
  uniforms:{ phase:{value:0}, uTime:{value:0}, uSize:{value: innerWidth<640?9.0:12.0} },
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    attribute vec3 tA; attribute vec3 tB; attribute vec3 tC; attribute vec3 pcolor; attribute float seed;
    uniform float phase; uniform float uTime; uniform float uSize;
    varying vec3 vColor; varying float vGlow;
    void main(){
      vec3 a = phase < 1.0 ? tA : tB;
      vec3 b = phase < 1.0 ? tB : tC;
      float f = phase < 1.0 ? phase : phase - 1.0;
      float ff = smoothstep(0.0, 1.0, f);
      vec3 pos = mix(a, b, ff);
      // transition burst → particles scatter into a galaxy at the midpoint
      float burst = sin(ff * 3.14159);
      float s = seed * 40.0;
      pos += vec3(sin(s+uTime*0.8), cos(s*1.3+uTime*0.7), sin(s*0.6+uTime*0.5)) * burst * 2.6;
      // gentle idle drift
      pos += vec3(sin(uTime*0.4+seed*10.0), cos(uTime*0.35+seed*8.0), 0.0) * 0.05;
      vColor = pcolor;
      vGlow = 0.55 + 0.45*sin(seed*30.0 + uTime*2.0) + burst*0.6;
      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      gl_PointSize = uSize * (1.0 / -mv.z) * 6.0;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader:`
    varying vec3 vColor; varying float vGlow;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      float alpha = smoothstep(0.5, 0.0, d);
      gl_FragColor = vec4(vColor * (1.2 + vGlow), alpha);
    }`
});
const points = new THREE.Points(geo, mat);
scene.add(points);

// ---- postprocessing: bloom ----
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.9, 0.6, 0.2);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---- legend ----
const genres=[['Literary',[1,0.83,0.47],34],['Sci-Fi',[0.48,0.88,1],24],['Fantasy',[0.54,0.48,1],18],['Mystery',[1,0.55,0.81],14],['Nonfiction',[0.35,0.82,0.75],10]];
document.getElementById('legend').innerHTML = genres.map(g=>{
  const col=`rgb(${g[1].map(v=>Math.round(v*255)).join(',')})`;
  return `<div style="color:${col}"><i style="background:${col}"></i><span style="color:#fff">${g[0]} ${g[2]}%</span></div>`;
}).join('');

// ---- scroll → phase + camera + overlays ----
const pA=document.getElementById('pA'), pB=document.getElementById('pB'), pC=document.getElementById('pC'), hint=document.getElementById('hint');
let targetPhase=0, phase=0;
function onScroll(){
  const max = document.getElementById('scroller').offsetHeight - innerHeight;
  const prog = Math.min(1, Math.max(0, scrollY / max));
  targetPhase = prog * 2.0;
  hint.style.opacity = prog>0.02 ? 0 : 0.35;
}
addEventListener('scroll', onScroll, {passive:true});
function clamp01(x){return Math.max(0,Math.min(1,x));}

function resize(){
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  mat.uniforms.uSize.value = innerWidth<640?9.0:12.0;
}
addEventListener('resize', resize);

const clock = new THREE.Clock();
function loop(){
  const t = clock.getElapsedTime();
  phase += (targetPhase - phase) * 0.06;
  mat.uniforms.phase.value = phase;
  mat.uniforms.uTime.value = t;
  // cinematic camera: dolly in + slow orbit
  const cz = 13 - Math.min(phase,2)*1.6;
  camera.position.x = Math.sin(t*0.15 + phase*0.6) * (1.2 + phase*0.4);
  camera.position.y = Math.sin(phase*1.2) * 0.6;
  camera.position.z = cz;
  camera.lookAt(0, (phase>1.4? (phase-1.4)*0.0 : 0), 0);
  points.rotation.y = phase>1.2 ? (t*0.12) : 0.0; // spin the helix
  // overlays
  pA.style.opacity = clamp01(1 - Math.abs(phase-0.0)/0.55);
  pB.style.opacity = clamp01(1 - Math.abs(phase-1.0)/0.45);
  pC.style.opacity = clamp01(1 - Math.abs(phase-2.0)/0.55);
  composer.render();
  requestAnimationFrame(loop);
}
onScroll(); loop();
</script>
</body>
</html>
